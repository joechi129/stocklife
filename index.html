<html lang="zh-Hant">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>股神養成計畫 · 股海人生</title>
<meta name="description" content="一款寫實的模擬股民遊戲。5 種出身、豐富人生支線,上千種結局組合。">

<style>
:root{
  --sk-red:#E30613;      /* 新光紅 */
  --sk-red2:#B00610;
  --sk-red3:#FF5A4D;
  --sk-ink:#2b0d10;
  --gold:#F6C453;
  --up:#38d39f;
  --down:#ff6b7a;
  --glass:rgba(255,255,255,.08);
  --glass2:rgba(255,255,255,.05);
  --glassborder:rgba(255,255,255,.16);
  --glasshi:rgba(255,255,255,.22);
  --ink:#fff5f5;
  --ink2:#f0d3d3;
  --ink3:#c99a9a;
  --shadow:0 20px 60px rgba(60,0,4,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0}
body{
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
  color:var(--ink);min-height:100vh;line-height:1.75;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 700px at 82% -8%, rgba(255,90,77,.45), transparent 55%),
    radial-gradient(900px 700px at 10% 8%, rgba(227,6,19,.55), transparent 50%),
    radial-gradient(1200px 900px at 50% 120%, rgba(120,4,14,.7), transparent 60%),
    linear-gradient(160deg,#6d0710 0%,#43060c 45%,#2a0509 100%);
  background-attachment:fixed;
}
.wrap{max-width:960px;margin:0 auto;padding:66px 15px 70px}
/* 新光證券「電視台標」:吊牌式固定在畫面正上方中間,全程都在 */
#skybug{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap;background:rgb(255,1,1);color:#fff;padding:6px 20px 6px;border-radius:0 0 15px 15px;box-shadow:0 6px 18px rgba(180,0,10,.32);pointer-events:none}
#skybug .sb-logo{height:34px;width:auto;display:block}
#skybug small{font-size:7.5px;font-weight:700;letter-spacing:4px;opacity:.85;line-height:1;text-indent:4px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";font-family:"SF Mono",ui-monospace,"Roboto Mono",monospace}

/* glass */
.glass{
  background:linear-gradient(160deg,var(--glass),var(--glass2));
  border:1px solid var(--glassborder);
  border-radius:22px;
  box-shadow:var(--shadow), inset 0 1px 0 var(--glasshi);
  backdrop-filter:blur(20px) saturate(140%);
  -webkit-backdrop-filter:blur(20px) saturate(140%);
}

/* brand / logo */
.brandbar{display:flex;align-items:center;gap:13px;margin:6px 4px 20px}
.logo{display:flex;align-items:center;gap:11px}
.logo .mark{width:44px;height:44px;flex:0 0 auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
.logo .txt .cn{font-size:21px;font-weight:900;letter-spacing:5px;line-height:1}
.logo .txt .en{font-size:9.5px;letter-spacing:2.5px;color:var(--ink3);margin-top:3px;font-weight:600}
.brandbar .prod{margin-left:auto;text-align:right}
.brandbar .prod .t1{font-size:16px;font-weight:800;letter-spacing:2px}
.brandbar .prod .t2{font-size:10px;color:var(--ink3);letter-spacing:1px}

/* hero */
.hero{padding:18px 22px 16px;text-align:center;position:relative;overflow:hidden;margin-bottom:14px}
.hero .kicker{font-size:11px;letter-spacing:6px;color:var(--sk-red3);font-weight:700;margin-bottom:8px}
.hero .big{font-size:28px;font-weight:900;letter-spacing:1px;line-height:1.25}
.hero .subttl{font-size:12.5px;letter-spacing:3px;color:var(--sk-red3);font-weight:700;margin-top:6px}
.hero .madeby{font-size:10.5px;letter-spacing:4px;color:var(--ink3);font-weight:700;margin-top:7px}
.hero .big .g{color:var(--gold)} .hero .big .r{color:var(--sk-red3)}
.hero .tagline{color:var(--ink2);font-size:13px;margin-top:8px;line-height:1.5;max-width:600px;margin-left:auto;margin-right:auto}
.ticker{display:none}   /* 跑馬燈收起,讓角色選項一進來就看得到 */
.ticker b{color:var(--up)} .ticker .dn{color:var(--down)}
.combo{display:none}    /* 「1000種結局」那行也收起,省首頁空間 */

.seedbar{display:flex;gap:8px;align-items:center;margin:20px 0 4px;flex-wrap:wrap;justify-content:center}
.seedbar label{font-size:12px;color:var(--ink3)}
.seedbar input{background:rgba(0,0,0,.25);border:1px solid var(--glassborder);color:var(--ink);padding:9px 13px;border-radius:12px;font-size:16px;width:180px;font-family:inherit}
.seedbar input:focus{outline:none;border-color:var(--sk-red3)}
.dicebar{margin-top:12px;flex-wrap:nowrap}
.dicebar input{width:132px;min-width:0;flex:0 1 auto}
.dicebar label{font-weight:800;color:var(--sk-red3);white-space:nowrap}
.dicebar .btn-mini{white-space:nowrap}
.dicehint{font-size:11.5px;line-height:1.7;color:var(--ink3);margin:9px 4px 2px;text-align:center}
.dicehint b{color:var(--sk-red);font-weight:800}
.btn-mini{font-size:12px;color:var(--ink2);border:1px solid var(--glassborder);padding:9px 13px;border-radius:12px;transition:.15s;background:var(--glass2)}
.btn-mini:hover{border-color:var(--sk-red3);color:#fff}

.section-title{font-size:12px;color:var(--ink2);letter-spacing:4px;margin:8px 6px 14px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.pc{text-align:left;padding:18px;transition:.2s;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;cursor:pointer}
.pc::after{content:"";position:absolute;inset:0;border-radius:22px;background:linear-gradient(160deg,rgba(255,90,77,.12),transparent 60%);opacity:0;transition:.2s;pointer-events:none}
.pc:hover{transform:translateY(-4px);border-color:var(--glasshi)}
.pc:hover::after{opacity:1}
.pc .top{display:flex;align-items:center;gap:13px}
.pc .em{font-size:34px;line-height:1;filter:drop-shadow(0 3px 8px rgba(0,0,0,.4))}
.pc .nm{font-weight:800;font-size:17px}
.pc .tg{font-size:11.5px;color:var(--sk-red3);letter-spacing:.5px;font-weight:600}
.pc .ds{font-size:12.5px;color:var(--ink2);line-height:1.6}
.pc .flaw{font-size:11.5px;color:var(--ink3)}
.pc .flaw b{color:var(--down)}
.pc .cap{display:flex;gap:12px;font-size:11px;color:var(--ink3);border-top:1px solid rgba(255,255,255,.1);padding-top:10px;margin-top:auto}
.pc .cap .mono{color:var(--gold)}

/* game */
#game{display:none}
.hud{padding:15px 17px;margin-bottom:15px}
.hud .row1{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.hud .who{display:flex;align-items:center;gap:11px;min-width:0}
.hud .who .em{font-size:28px}
.hud .who .nm{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .who .tg{font-size:11px;color:var(--sk-red3);font-weight:600}
.hud .clock{text-align:right;font-size:12px;color:var(--ink3);flex:0 0 auto}
.hud .hdright{margin-left:auto;display:flex;align-items:center;gap:10px;flex:0 0 auto}
.ovr{display:flex;flex-direction:column;align-items:center;justify-content:center;width:58px;height:50px;border-radius:13px;background:linear-gradient(160deg,#d3a12a,#8a6508);color:#fff;box-shadow:0 4px 12px rgba(184,134,11,.35);flex:0 0 auto}
.ovr .ovrn{font-size:23px;font-weight:900;line-height:1}
.ovr .ovrl{font-size:8.5px;letter-spacing:.5px;margin-top:2px;opacity:.92}
.phasebar{margin-bottom:12px}
.phz{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;gap:8px}
.phz .phname{font-weight:800;color:#b8860b;font-size:13.5px;flex:0 0 auto}
.phz .phnext{color:var(--ink3);font-size:10.5px;text-align:right;min-width:0}
.phsegs{display:flex;gap:4px}
.phseg{flex:1;height:6px;border-radius:99px;background:rgba(0,0,0,.1);overflow:hidden}
.phseg i{display:block;height:100%;background:linear-gradient(90deg,#e0a52a,#b8860b);border-radius:99px;transition:width .4s}
.hud .clock b{color:#fff;font-size:16px}
.wealth{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:13px}
.wcell{background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.1);border-radius:13px;padding:10px 11px}
.wcell .k{font-size:10px;color:var(--ink3);letter-spacing:1px}
.wcell .v{font-size:15px;font-weight:800;margin-top:3px}
.wcell.net .v{color:var(--gold)}
.pos{color:var(--up)} .neg{color:var(--down)}
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.bar .bl{display:flex;justify-content:space-between;font-size:11px;color:var(--ink2);margin-bottom:5px}
.bar .bl .mono{color:#fff}
.track{height:8px;border-radius:99px;background:rgba(0,0,0,.3);overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.fill{height:100%;border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.fill.mind{background:linear-gradient(90deg,#8b7bff,#b3a7ff)}
.fill.rel{background:linear-gradient(90deg,#ff6b9d,#ffa7c4)}
.fill.fame{background:linear-gradient(90deg,#d99a2e,var(--gold))}

.stage{padding:22px 22px 24px;min-height:230px}
.beat-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.beat-head .yr{font-size:11px;color:var(--ink2);border:1px solid var(--glassborder);border-radius:99px;padding:4px 11px;letter-spacing:1px;background:var(--glass2)}
.beat-head .tt{font-size:18px;font-weight:800;letter-spacing:.5px}
.beat-head .chap{font-size:10.5px;color:var(--sk-red3);letter-spacing:3px;font-weight:800}
.story{font-size:15.5px;color:#fff0f0;line-height:2;letter-spacing:.3px;white-space:pre-wrap}
.result{margin:15px 0 2px;padding:15px 17px;border-radius:14px;border-left:3px solid var(--sk-red3);background:rgba(255,90,77,.1);font-size:14.5px;line-height:1.85;color:#ffe6e6;animation:fade .4s}
.result.good{border-color:var(--up);background:rgba(56,211,159,.1)}
.result.bad{border-color:var(--down);background:rgba(255,107,122,.12)}
.result .deltas{margin-top:8px;display:flex;gap:13px;flex-wrap:wrap;font-size:12px}
.choices{display:flex;flex-direction:column;gap:11px;margin-top:20px}
.choice{text-align:left;padding:16px 18px;border-radius:16px;border:1px solid var(--glassborder);background:linear-gradient(160deg,var(--glass),var(--glass2));transition:.16s;position:relative;backdrop-filter:blur(6px)}
.choice:hover{border-color:var(--sk-red3);transform:translateX(4px);background:rgba(255,90,77,.12)}
.choice .cl{font-size:14.5px;font-weight:700}
.choice .ch{font-size:12px;color:var(--ink3);margin-top:4px}
.choice .arrow{position:absolute;right:15px;top:50%;transform:translateY(-50%);color:var(--sk-red3);opacity:0;transition:.16s}
.choice:hover .arrow{opacity:1;right:12px}
.nextbtn{margin-top:20px;width:100%;padding:16px;border-radius:15px;font-weight:800;font-size:15px;background:linear-gradient(90deg,var(--sk-red2),var(--sk-red),var(--sk-red3));color:#fff;transition:.15s;box-shadow:0 10px 26px rgba(227,6,19,.4);letter-spacing:1px}
.nextbtn:disabled{opacity:.4;filter:grayscale(.55);box-shadow:none;cursor:not-allowed;background:#c9b6b6;color:#fff}
.nextbtn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.log{margin-top:15px;padding:14px 16px}
.log .lt{font-size:11px;color:var(--ink3);letter-spacing:2px;margin-bottom:9px}
.log .li{font-size:12.5px;color:var(--ink2);padding:6px 0;border-top:1px dashed rgba(255,255,255,.12);line-height:1.6}
.log .li:first-of-type{border-top:none}
.log .li .yr{color:var(--sk-red3);margin-right:8px}

/* ending */
.ending{padding:34px 26px;text-align:center;animation:fade .6s}
.ending .elogo{margin-bottom:18px;display:flex;justify-content:center}
.ending .em{font-size:70px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5))}
.ending .ti{font-size:28px;font-weight:900;margin:12px 0 4px;letter-spacing:1px}
.ending .rank{font-size:13px;color:var(--gold);letter-spacing:3px;margin-bottom:6px}
.ending .combo2{font-size:11px;color:var(--ink3);margin-bottom:18px}
.ending .tx{font-size:15px;color:#ffecec;line-height:2;max-width:600px;margin:0 auto 24px;text-align:left;white-space:pre-wrap}
.final{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;max-width:480px;margin:0 auto 22px}
.final .fc{background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:13px}
.final .fc.big{grid-column:span 2}
.final .fc .k{font-size:11px;color:var(--ink3)}
.final .fc .v{font-size:19px;font-weight:900;margin-top:4px}
.final .fc.big .v{font-size:26px;color:var(--gold)}
.resultimg{margin:6px auto 18px;max-width:360px}
.resultimg img{width:100%;height:auto;display:block;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.25);border:1px solid var(--glassborder)}
.resultimg .rihint{font-size:12px;color:var(--ink3);margin-top:8px;text-align:center}
.endbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.endbtns button{padding:13px 18px;border-radius:13px;font-weight:800;font-size:13.5px;max-width:100%}
.eb-main{background:linear-gradient(90deg,var(--sk-red2),var(--sk-red3));color:#fff;box-shadow:0 8px 20px rgba(227,6,19,.35)}
.eb-share{border:1px solid var(--glassborder);color:var(--ink);background:rgba(255,255,255,.62);white-space:nowrap}
.eb-share:hover{border-color:var(--gold);color:var(--ink)}
.eb-alt{border:1px solid var(--glassborder);color:var(--ink2)}
.eb-alt:hover{border-color:var(--sk-red3);color:var(--sk-red)}
.toast{margin:16px auto 0;max-width:440px;font-size:13px;color:var(--gold);border:1px solid rgba(246,196,83,.4);background:rgba(246,196,83,.1);border-radius:12px;max-height:0;overflow:hidden;opacity:0;transition:.3s}
.toast.show{max-height:70px;opacity:1;padding:11px 14px}

.foot{text-align:center;color:var(--ink3);font-size:11px;margin-top:28px;line-height:1.9}
.foot .by{color:var(--ink2);font-weight:700;letter-spacing:1px}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:560px){
  .wealth{grid-template-columns:repeat(2,1fr)}
  .grid{grid-template-columns:1fr}
  .final{grid-template-columns:1fr 1fr}
  /* 首頁精簡:一進來就看到角色選項,不用下滑 */
  .wrap{padding:64px 14px 60px}
  #start .hero{padding:16px 18px 14px;margin-bottom:12px}
  #start .hero .kicker{font-size:10px;letter-spacing:4px;margin-bottom:6px}
  #start .hero .big{font-size:24px;line-height:1.2}
  #start .hero .tagline{font-size:12.5px;margin-top:8px;line-height:1.5}
  #start .hero .ticker,#start .hero .combo{display:none}   /* 跑馬燈/結局組合字先收起,省空間 */
  #start .hero .seedbar{margin:12px 0 0}
  .section-title{margin:2px 6px 10px}
  #start .grid .pc{padding:12px 14px}
  #start .grid .pc .em{font-size:28px}
  #start .grid .pc .pcinfo .nm{font-size:16px}
}

/* ============ 手機優先 mobile-first + 下注/骰子/技能 ============ */
.wrap{max-width:480px}
/* 出身:精簡直式清單 */
#start .grid{display:flex;flex-direction:column;grid-template-columns:none;gap:10px}
#start .grid .pc{flex-direction:row;align-items:center;gap:14px;padding:15px 16px}
#start .grid .pc .em{font-size:32px;flex:0 0 auto}
#start .grid .pc .pcinfo{flex:1;min-width:0}
#start .grid .pc .pcinfo .nm{font-size:17px;font-weight:800}
#start .grid .pc .pcinfo .pcsub{font-size:12px;color:var(--ink3);margin-top:3px}
#start .grid .pc .pcgo{font-size:20px;color:var(--sk-red3);flex:0 0 auto;opacity:.7}
/* 背景介紹彈窗 */
#introSheet .introtag{font-size:12px;color:var(--sk-red3);font-weight:700;letter-spacing:1px;margin:-6px 0 12px}
#introSheet .introflaw{font-size:13px;color:var(--ink2);margin:12px 0 6px}
#introSheet .introflaw b{color:var(--down)}
#introSheet .introstats{font-size:13px;color:var(--ink2);background:rgba(0,0,0,.2);border:1px solid var(--glassborder);border-radius:12px;padding:11px 13px;margin-bottom:16px}
#introSheet .introstats b{color:var(--gold);font-size:15px}
body{padding-bottom:env(safe-area-inset-bottom)}
#game .hud{position:static}
/* 技能列 */
.skbar{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:11px;border-top:1px solid rgba(255,255,255,.1)}
.skbar .sp{font-size:12px;color:var(--ink2)}
.skbar .sp b{color:var(--gold);font-size:15px;font-weight:800}
.skbar .grow{flex:1}
.skbtn{font-size:12.5px;font-weight:700;color:#fff;border:1px solid var(--glassborder);background:var(--glass);border-radius:11px;padding:8px 12px;transition:.15s}
.skbtn:hover,.skbtn:active{border-color:var(--gold);background:rgba(246,196,83,.14)}
.skbtn .dot{display:inline-block;min-width:16px;height:16px;line-height:16px;text-align:center;background:var(--sk-red);color:#fff;border-radius:99px;font-size:10px;margin-left:3px;font-weight:800}

/* 下注(倍數)事件 */
.betwrap{margin-top:18px}
.betwrap .bl{font-size:12px;color:var(--ink3);letter-spacing:1px;margin-bottom:10px;text-align:center}
.bets{display:flex;flex-direction:column;gap:11px}
.betopt{display:flex;align-items:center;gap:13px;text-align:left;padding:14px 16px;border-radius:16px;border:1px solid var(--glassborder);background:linear-gradient(160deg,var(--glass),var(--glass2));transition:.16s;position:relative}
.betopt:hover,.betopt:active{transform:translateY(-2px)}
.betopt .mx{font-size:22px;font-weight:900;width:52px;text-align:center;border-radius:12px;padding:8px 0;flex:0 0 auto}
.betopt.t1{border-color:rgba(56,211,159,.4)} .betopt.t1 .mx{background:rgba(56,211,159,.16);color:var(--up)}
.betopt.t2{border-color:rgba(246,196,83,.4)} .betopt.t2 .mx{background:rgba(246,196,83,.16);color:var(--gold)}
.betopt.t3{border-color:rgba(255,90,77,.5)} .betopt.t3 .mx{background:rgba(255,90,77,.18);color:var(--sk-red3)}
.betopt.t1:hover{box-shadow:0 8px 20px rgba(56,211,159,.2)}
.betopt.t2:hover{box-shadow:0 8px 20px rgba(246,196,83,.2)}
.betopt.t3:hover{box-shadow:0 8px 20px rgba(255,90,77,.25)}
.betopt .bi .bt{font-size:15px;font-weight:800}
.betopt .bi .bs{font-size:11.5px;color:var(--ink3);margin-top:2px}
.betopt .bi .amt{font-size:12px;color:var(--gold);margin-top:3px;font-weight:700}
.betopt .odds{margin-left:auto;text-align:right;font-size:10.5px;color:var(--ink3);flex:0 0 auto}

/* 骰子動畫 */
.dice{width:70px;height:70px;border-radius:16px;background:#fff;color:#B00610;display:grid;place-items:center;font-size:40px;font-weight:900;margin:6px auto 0;box-shadow:0 8px 22px rgba(0,0,0,.4);transition:transform .1s}
.dice.sm{width:52px;height:52px;font-size:32px;margin:0}
.dice.num{font-weight:900;font-family:"Helvetica Neue",Arial,sans-serif}
.dice.sm.num{font-size:30px}
.dice.sm.g{background:#e9fff5;color:#1c9963;box-shadow:0 6px 16px rgba(46,194,126,.35)}
.dice.sm.b{background:#ffecef;color:#d63d4c;box-shadow:0 6px 16px rgba(255,91,106,.3)}
.dicerow{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;min-height:52px;align-items:center}
.incbanner{margin:12px 0 4px;padding:10px 13px;border-radius:12px;border-left:3px solid var(--up);background:rgba(46,194,126,.12);font-size:13.5px;color:#1c7a52}

.incbanner.neg b{color:#b02a3a}
.spwarn{margin:12px 0 2px;padding:11px 13px;border-radius:12px;border:1px solid rgba(214,61,76,.4);background:rgba(214,61,76,.1);font-size:13px;color:#b02a3a;line-height:1.6}
.spwarn b{color:#b02a3a;font-size:15px}
.yearbtns{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.rollbtn.ghost{background:rgba(255,255,255,.6);color:var(--sk-red3);border:1px solid rgba(227,6,19,.35);box-shadow:none;margin-top:0}
.rollbtn.train-open{margin-top:14px;font-size:14px;padding:13px}
.quitlife{display:block;width:100%;margin-top:16px;padding:11px;border-radius:12px;background:transparent;border:1px dashed var(--glassborder);color:var(--ink3);font-size:12.5px}
.quitlife:hover{border-color:var(--sk-red3);color:var(--sk-red3)}
.spbadge{display:inline-block;margin-left:6px;padding:2px 9px;border-radius:99px;background:var(--gold);color:#fff;font-size:12px;font-weight:800;vertical-align:middle}
.tbtip{font-size:13px;color:var(--ink2);line-height:1.6;margin-bottom:12px;text-align:left}
.trainbox{margin-top:16px;padding:16px 15px;border-radius:16px;background:rgba(0,0,0,.14);border:1px solid var(--glassborder);text-align:center}
.trainbox .dicerow{margin-bottom:8px}
.dice.roll{animation:shake .5s}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg) scale(1.06)}75%{transform:rotate(14deg) scale(1.06)}}

/* bottom sheet 彈窗 */
.sheetbg{position:fixed;inset:0;background:rgba(20,0,3,.6);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.25s;z-index:60}
.sheetbg.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;max-width:480px;margin:0 auto;transform:translateY(110%);transition:transform .3s cubic-bezier(.2,.9,.3,1);padding:20px 18px calc(24px + env(safe-area-inset-bottom));border-radius:26px 26px 0 0}
.sheet.show{transform:translateY(0)}
.sheet .sh{display:flex;align-items:center;margin-bottom:14px}
.sheet .sh .st{font-size:17px;font-weight:800}
.sheet .sh .sx{margin-left:auto;font-size:22px;color:var(--ink3);cursor:pointer;line-height:1;padding:2px 6px}
.sheet .desc{font-size:12.5px;color:var(--ink2);line-height:1.7;margin-bottom:14px}
.dicebox{text-align:center;padding:6px 0 14px}
.dicebox .res{font-size:13px;color:var(--gold);margin-top:12px;min-height:20px;font-weight:700}
.rollbtn{width:100%;padding:15px;border-radius:15px;font-weight:800;font-size:15px;background:linear-gradient(90deg,var(--sk-red2),var(--sk-red3));color:#fff;margin-top:8px;box-shadow:0 8px 20px rgba(227,6,19,.35)}
.rollbtn:disabled{opacity:.4;filter:grayscale(.6);box-shadow:none}
.rollbtn .c{font-size:12px;opacity:.85;font-weight:600}

.skills{display:flex;flex-direction:column;gap:11px}
.skl{display:flex;align-items:center;gap:12px;padding:15px 15px;border-radius:15px;border:1px solid var(--glassborder);background:var(--glass2)}
.skl .ic{font-size:26px;flex:0 0 auto}
.skl .info{flex:1;min-width:0}
.skl .info .n{font-size:14px;font-weight:800}
.skl .info .d{font-size:11px;color:var(--ink3);margin-top:2px;line-height:1.5}
.skl .prog{font-size:11px;color:var(--ink3);margin-top:5px}
.skl .prog b{color:var(--gold)}
.skl .lv{display:flex;flex-wrap:nowrap;gap:3px;margin-top:5px;justify-content:center}
.skl .lv i{flex:0 1 14px;min-width:5px;height:5px;border-radius:99px;background:rgba(255,255,255,.14)}
.skl .lv i.on{background:var(--gold)}
.skl .up{flex:0 0 auto;width:62px;height:62px;border-radius:16px;background:linear-gradient(160deg,var(--sk-red),var(--sk-red2));color:#fff;font-size:26px;font-weight:900;display:grid;place-items:center;white-space:nowrap;line-height:1;transition:.15s;touch-action:manipulation;box-shadow:0 4px 12px rgba(227,6,19,.32);-webkit-user-select:none;user-select:none}
.skl .up:active{transform:scale(.92)}
.skl .up:disabled{opacity:.35;filter:grayscale(.7);box-shadow:none}
.skl .up.max{background:rgba(255,255,255,.1);font-size:13px;font-weight:700}
.sheet .spline{text-align:center;font-size:13px;color:var(--ink2);margin-bottom:12px}
.sheet .spline b{color:var(--gold);font-size:17px}

<script>
/* ============================================================
   股海人生 · 股神養成計畫  — 引擎 v2(場景圖分支 + 組合式結局)
   ============================================================ */
function hashSeed(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=(h<<13)|(h>>>19);}return (h>>>0)||123456789;}
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296;};}
let RNG=Math.random,SEED='';
function setSeed(s){SEED=s;RNG=s?mulberry32(hashSeed(s)):Math.random;}

function pickWeighted(list){const tot=list.reduce((a,o)=>a+(o.w||1),0);let r=RNG()*tot;for(const o of list){r-=(o.w||1);if(r<=0)return o;}return list[list.length-1];}

const unitStr=(val,digits,suf)=>{let t=val.toFixed(digits);if(t.indexOf('.')>=0)t=t.replace(/\.?0+$/,'');const p=t.split('.');return commaInt(p[0])+(p[1]?'.'+p[1]:'')+suf;};  /* 去掉多餘的 .0 */
const fmt=n=>{
  const neg=n<0;n=Math.abs(Math.round(n));let s;
  if(n>=100000000)s=unitStr(n/100000000,2,'億');
  else if(n>=10000)s=unitStr(n/10000,(n>=1000000?0:1),'萬');
  else s=commaInt(String(n));
  return (neg?'-':'')+s;
};

/* ---------- 啟動畫面 ---------- */
function roleOf(c){const parts=c.tag.split('·');return (parts[1]||c.tag).trim();}
let PENDING=null;
function openIntro(c){
  PENDING=c;
  document.getElementById('introEm').textContent=c.emoji;
  document.getElementById('introRole').textContent=roleOf(c);
  document.getElementById('introTag').textContent=c.tag;
  document.getElementById('introDesc').textContent=c.desc;
  document.getElementById('introFlaw').innerHTML='⚠️ 弱點:<b>'+c.flaw+'</b>';
  document.getElementById('introStats').innerHTML=`💰 起始資本 <b>${fmt(net(c.start))}</b>${c.start.debt?' · 負債 '+fmt(c.start.debt):''} · ${c.start.age} 歲`;
  openSheet('introSheet');
}
function buildStart(){
  const r=document.getElementById('roster');r.innerHTML='';
  CHARS.forEach(c=>{
    const role=roleOf(c);
    const el=document.createElement('button');el.className='glass pc';
    el.innerHTML=`<span class="em">${c.emoji}</span>
      <div class="pcinfo"><div class="nm">${role}</div><div class="pcsub">起始資本 <span class="mono" style="color:var(--gold)">${fmt(net(c.start))}</span> · ${c.start.age} 歲</div></div>
      <span class="pcgo">→</span>`;
    el.onclick=()=>openIntro(c);r.appendChild(el);
  });
  const si=document.getElementById('seedInput');if(si&&!si.value.trim())si.value=genSeed();   // 先給一組預設命運編號
}
document.getElementById('seedRand').onclick=()=>{document.getElementById('seedInput').value=genSeed();};

/* ---------- 開始 ---------- */
let PNAME='';
function startGame(c){
  let seed=document.getElementById('seedInput').value.trim();
  if(!seed){seed=genSeed();}
  setSeed(seed);
  const nm=(document.getElementById('nameInput').value||'').trim();
  PNAME=nm||c.name;
  CUR=c;CURID=c.id;
  track('game_start',{character:c.id,character_name:c.name});   // 📊 哪個出身最熱門
  S=JSON.parse(JSON.stringify(c.start));
  S.flags={};S.log=[];S.scene=c.first;S.sp=0;S.skills={};S.skillProg={};S.diceRolls=0;
  S.retireOffered=false;S.retired=false;S.bankrupt=false;S.pendingScene=null;S.retireLatch=false;S.lastIncome=null;S.resume=null;
  /* === 每局不一樣:開局狀況 + 里程碑順序洗牌 === */
  const op=OPENINGS[Math.floor(RNG()*OPENINGS.length)];
  S.cash=Math.max(0,Math.round(S.cash+(op.cashU||0)*(c.income||100000)));
  if(op.mind)S.mind=clamp(S.mind+op.mind);if(op.rel)S.rel=clamp(S.rel+op.rel);if(op.fame)S.fame=clamp(S.fame+op.fame);
  S.openingLine=op.t+' — '+op.x;
  const mid=(c.mid||[]).slice();
  for(let i=mid.length-1;i>0;i--){const j=Math.floor(RNG()*(i+1));const tmp=mid[i];mid[i]=mid[j];mid[j]=tmp;}   // 洗牌
  if(mid.length>2&&RNG()<0.45)mid.splice(Math.floor(RNG()*mid.length),1);                                     // 隨機丟掉一個
  S.mile=['start','bull'].concat(mid,['gamble','crash']);
  S.mainSet=new Set(['bull','gamble','crash'].concat(c.mid||[]));
  S.mileIdx=0;S.ages={start:S.age};let aa=S.age;
  for(let i=1;i<S.mile.length;i++){aa+=2+Math.floor(RNG()*4);S.ages[S.mile[i]]=aa;}                            // 里程碑年齡:每次也不同
  S.lastBetAge=S.age;S.dayIdx=0;S.daysThisYear=0;
  document.getElementById('start').style.display='none';

  document.getElementById('hEm').textContent=c.emoji;

  document.getElementById('hTg').textContent=roleOf(c);   // 只顯示身分,年齡以上方 HUD 為準(避免顯示開局年齡造成矛盾)
  window.scrollTo(0,0);renderHUD();renderScene();
}

/* 操盤戰力:純能力值(技能 + 心態/關係/名聲),跟錢無關——錢是結果,戰力是實力。30~99 */
function calcOVR(){let t=0;SKILLS.forEach(s=>t+=lvl(s.id));const q=stateQuality();return Math.round(30+(t/(SKILLS.length*10))*55+q*14);}
/* 人生階段:看資本額佔「財富自由門檻」的比例(散戶→…→股市傳奇) */
/* 股市角色級距:採市場現實的「絕對金額」定義,不分角色一體適用
   韭菜散戶 <100萬 → 小資操盤手 100萬+ → 中實戶 3,000萬+ → 大戶 1億+ → 超級大戶 3億+ → 股市傳奇 10億+ */
const PHASES=['韭菜散戶','小資操盤手','中實戶','大戶','超級大戶','股市傳奇'];
const PHASE_AMT=[0,1000000,30000000,100000000,300000000,1000000000];
function renderPhase(){
  const nn=net(S);
  const THR=PHASE_AMT;
  let i=0;for(let k=0;k<THR.length;k++){if(nn>=THR[k])i=k;}
  const pn=document.getElementById('hPhase');if(pn)pn.textContent=PHASES[i];
  const nx=document.getElementById('hPhaseNext');
  if(nx){if(i<PHASES.length-1){const need=Math.max(0,Math.round(THR[i+1])-nn);nx.textContent=`距「${PHASES[i+1]}」還差 ${fmt(need)}`;}else nx.textContent='已達頂點 · 股神級';}
  const segEl=document.getElementById('hPhaseSegs');
  if(segEl){let html='';for(let k=0;k<PHASES.length;k++){let w=0;if(k<i)w=100;else if(k===i){const lo=THR[k],hi=(k<PHASES.length-1?THR[k+1]:THR[k]*2);w=Math.max(8,Math.min(100,(nn-lo)/((hi-lo)||1)*100));}html+=`<span class="phseg"><i style="width:${w}%"></i></span>`;}segEl.innerHTML=html;}
}
/* 年紀逐年遞增動畫(一歲一歲跳) */

function applyDelta(d){if(!d)return;for(const k in d){let v=d[k];if(k==='mind'&&v<0)v*=Math.max(0.1,1-0.15*lvl('mindful'));if(k==='rel'&&v>0)v*=(1+0.2*lvl('network'));if(k==='mind'||k==='rel'||k==='fame')S[k]=clamp(S[k]+v);else S[k]=(S[k]||0)+v;}
  if(S.stock<0){S.cash+=S.stock;S.stock=0;}   // 持股最多賠到歸零,超出的部分從現金扣(不足再轉負債)
  if(S.cash<0){S.debt=(S.debt||0)-S.cash;S.cash=0;}}
function applySet(set){if(!set)return;for(const k in set){const v=set[k];if(typeof v==='string'&&v[0]==='+')S.flags[k]=(S.flags[k]||0)+(+v.slice(1));else S.flags[k]=v;}}
function deltaText(d){const map={cash:'現金',stock:'持股',debt:'負債',mind:'心態',rel:'關係',fame:'名聲'};const money=['cash','stock','debt'];const parts=[];for(const k in d){if(!d[k])continue;const up=d[k]>0;const val=money.includes(k)?fmt(Math.abs(d[k])):Math.abs(d[k]);const good=(k==='debt')?!up:up;parts.push(`<span style="color:${good?'var(--up)':'var(--down)'}">${map[k]} ${up?'+':'−'}${val}</span>`);}return parts.join('  ');}

/* 每一年的收入都不一樣:景氣有好有壞;上班族隨年資慢慢加薪;老闆本業獲利大起大落、壞年頭可能虧損 */
function yearlyIncome(){
  const base=CUR.income||0;
  if(!base)return {inc:0,label:CUR.incomeLabel||'工作收入',situ:'這一年沒有固定收入'};
  const yearsIn=Math.max(0,S.age-((CUR.start&&CUR.start.age)||S.age));
  const r=RNG();const id=CURID;let mult,situ;
  if(id==='founder'){
    if(r<0.15){mult=-0.4;situ='訂單銳減,本業小虧';}
    else if(r<0.35){mult=0.5;situ='景氣偏冷,獲利縮水';}
    else if(r<0.65){mult=1.0;situ='營運平穩,獲利照舊';}
    else if(r<0.88){mult=1.8;situ='接單暢旺,獲利豐收';}
    else{mult=2.8;situ='接到大單,營收翻倍';}
  }else if(id==='richkid'){
    if(r<0.2){mult=0.6;situ='家裡今年手頭緊,生活費縮水';}
    else if(r<0.75){mult=1.0;situ='爸爸照常給生活費';}
    else{mult=1.6;situ='家裡投資有賺,多塞你一筆';}
  }else{
    const senior=1+0.05*yearsIn;let econ;
    if(r<0.15){econ=0.85;situ='景氣寒冬,薪水凍漲';}
    else if(r<0.4){econ=0.95;situ='景氣普通,小幅調薪';}
    else if(r<0.72){econ=1.1;situ='年資加薪,穩穩入袋';}
    else if(r<0.92){econ=1.35;situ='產業景氣好,年終加碼';}
    else{econ=1.7;situ='升遷加薪,收入大跳';}
    mult=senior*econ;
  }
  return {inc:Math.round(base*mult),label:CUR.incomeLabel||'工作收入',situ};
}
/* ===== 逐年推進引擎:一次只過一年、每年都有內容;里程碑每局順序不同,跑完後無限延伸 ===== */
function scAge(id){return (S.ages&&S.ages[id]!==undefined)?S.ages[id]:undefined;}
/* 決定下一步要往哪:主線里程碑→跳到本局播放清單的下一個;支線場景→照走;其餘→無限模式 */
function advanceCourse(go){
  if(go&&S.mainSet&&S.mainSet.has(go)){S.mileIdx++;const nxt=S.mile[S.mileIdx];S.resume=(nxt&&CUR.scenes[nxt])?nxt:null;return;}
  if(go&&CUR.scenes[go]&&go!=='fork'&&go!=='final'){S.resume=go;return;}
  S.resume=null;
}
function continueTo(go){advanceCourse(go);step();window.scrollTo({top:0,behavior:'smooth'});}
function stepKeep(){step();window.scrollTo({top:0,behavior:'smooth'});}   // 生活事件:不改變前進的目標
/* 前進一個「片刻」:支線立即銜接;同一年還有日常就演日常(不加歲);否則跨到新的一年 */
function step(){
  const r=S.resume;
  if(r&&CUR.scenes[r]&&scAge(r)===undefined){arriveScripted(r);return;}         // 支線:同年立即銜接
  if((S.dayIdx||0)<(S.daysThisYear||0)){S.dayIdx++;S.lastIncome=null;S.lastStock=null;renderGenLife(pickDaily());return;} // 年中的日常(同一歲,好幾件)
  openNewYear();
}
function gate(){
  const nn=net(S),thr=RETIRE_AT[CURID]||Infinity;
  if(nn>=thr){
    if(!S.retireLatch){renderRetire();return true;}     // 到門檻→問要不要退休
    if(RNG()<0.38){renderMisfortune();return true;}     // 續玩→有機率遇到意外
  }
  return false;
}
/* 跨到新的一年:年齡剛好 +1、結算收入,然後決定這一年的「大事」;沒有大事就是平凡的一年(幾件日常) */
function openNewYear(){
  S.age++;S.year++;
  /* 歲月消磨:心態/關係/名聲每年自然下滑,站得越高越難維持(得靠選擇與事件補回來) */
  const wear=v=>clamp(v-(v>85?3:v>65?2:1));
  S.mind=wear(S.mind);S.rel=wear(S.rel);S.fame=clamp(S.fame-(S.fame>85?2:1));
  if(CUR.income){const yi=yearlyIncome();S.cash+=yi.inc;if(S.cash<0){S.debt=(S.debt||0)-S.cash;S.cash=0;}
    S.lastIncome={inc:yi.inc,label:yi.label,situ:yi.situ,hadLoss:yi.inc<0};
    S.log.push({yr:S.year,txt: yi.inc>=0?`${S.age} 歲・${yi.situ},進帳 ${fmt(yi.inc)}`:`${S.age} 歲・${yi.situ},虧損 ${fmt(-yi.inc)}`});
  }else S.lastIncome=null;
  /* 包租公租金:名下第 2 間起的房產,每年穩定收租(第 1 間自住) */
  const hs=(S.flags&&S.flags.houses)||0;
  if(hs>=2){const rent=(hs-1)*(CUR.rentUnit||300000);S.cash+=rent;S.lastRent=rent;
    S.log.push({yr:S.year,txt:`🏠 包租公租金入帳 ${fmt(rent)}`});}
  else S.lastRent=null;
  /* 持股複利:抱著的股票每年會隨市場滾動(多數年份成長,偶爾回檔)——這就是複利的力量 */
  if(S.stock>0){
    const rr=RNG();let ret;   // 每年市場報酬:平均約 +2%,波動更大;約7%機率遇到股災重挫
    if(rr<0.07)ret=-0.30-RNG()*0.20;   // 股災:−30%~−50%,不算罕見而且很痛
    else if(rr<0.22)ret=-0.10;else if(rr<0.45)ret=0.03;else if(rr<0.72)ret=0.07;else if(rr<0.90)ret=0.12;else ret=0.17;
    const crash=ret<=-0.22;
    const gain=Math.round(S.stock*ret);S.stock=Math.max(0,S.stock+gain);
    S.lastStock={gain,ret,crash};
    S.log.push({yr:S.year,txt: crash?`💥 股災!持股重挫 ${fmt(-gain)}`:(gain>=0?`持股複利滾出 ${fmt(gain)}`:`持股回檔 ${fmt(-gain)}`)});
  }else S.lastStock=null;
  renderHUD();
  const hA=document.getElementById('hAge');if(hA){hA.style.color='var(--sk-red)';setTimeout(()=>{hA.style.color='';},260);}
  S.dayIdx=0;
  if(gate()){S.daysThisYear=(RNG()<0.5?1:0);return;}                                                     // 意外年
  const r=S.resume;
  if(r&&CUR.scenes[r]&&scAge(r)!==undefined&&scAge(r)<=S.age){S.daysThisYear=(RNG()<0.5?1:0);arriveScripted(r);return;} // 里程碑年
  if(S.age-(S.lastBetAge||S.age)>=3){S.daysThisYear=(RNG()<0.5?1:0);S._genbet=makeGenBet();renderTrainStep('__genbet__');return;}  // 投資年
  S.daysThisYear=1+(RNG()<0.6?1:0)+(RNG()<0.3?1:0);S.dayIdx=1;renderGenLife(pickDaily());               // 平凡的一年:1~3 件日常
}
function arriveScripted(id){
  const sc=CUR.scenes[id];
  if(!sc){renderGenLife(pickDaily());return;}
  if(sc.kind==='bet'){
    // 修煉(骰子)固定「3 年才一次」:若距上次修煉不到 3 年,這次投資就直接進場、不再修煉
    if(S.lastBetAge!==undefined && (S.age-S.lastBetAge)<3){S.scene=id;renderScene();return;}
    renderTrainStep(id);return;   // 投資篇章→進場前先給修煉
  }
  S.scene=id;renderScene();
}
/* 挑一個「最近沒出現過」的日常事件,避免短時間內重複同一件事 */
function pickDaily(){
  if(!S.recentDaily)S.recentDaily=[];
  const U=CUR.income||100000;
  /* 只挑「符合條件」的事件(例如沒生小孩就不會出現育兒事件) */
  const elig=[];for(let i=0;i<GEN_LIFE.length;i++){const ev=GEN_LIFE[i](U);if(!ev.req||ev.req(S))elig.push(i);}
  const avoid=new Set(S.recentDaily);
  let pool=elig.filter(i=>!avoid.has(i));
  if(!pool.length)pool=elig.length?elig.slice():GEN_LIFE.map((_,i)=>i);
  /* 開局前幾年優先抽「話題事件」:先讓玩家遇到好玩、想截圖的事,正經沉重的留給中後期 */
  const VIRAL=new Set(['寶可夢卡包的誘惑','盲盒隱藏款之亂','迷因幣的暴富神話','雞排店老闆的明牌','年夜飯上的明牌大會','命理老師的財位','「老師」的來電','對發票的奇蹟','阿公留下的老箱子','同學會的攀比大戰','天王演唱會搶票','中華隊奪冠之夜','AI 選股神器','直播間的剁手夜','毛小孩的緣分','燒錢的新嗜好']);
  const early=(S.age-((CUR.start&&CUR.start.age)||S.age))<=4;
  if(early){
    const vp=pool.filter(i=>VIRAL.has(GEN_LIFE[i](U).t));
    const firstDaily=!(S.dailyCount>0);
    if(vp.length&&(firstDaily||RNG()<0.7))pool=vp;   // 第一件日常保證話題向,之後前期 70% 偏話題
  }
  S.dailyCount=(S.dailyCount||0)+1;
  const idx=pool[Math.floor(RNG()*pool.length)];
  S.recentDaily.push(idx);
  const keep=Math.min(9,GEN_LIFE.length-1);   // 記住最近 9 件,這段時間內不重覆
  while(S.recentDaily.length>keep)S.recentDaily.shift();
  return GEN_LIFE[idx](U);
}
function makeGenBet(){
  if(!S.recentBet)S.recentBet=[];
  const avoid=new Set(S.recentBet);
  let pool=[];for(let i=0;i<GEN_BET_TITLES.length;i++)if(!avoid.has(i))pool.push(i);
  if(!pool.length){for(let i=0;i<GEN_BET_TITLES.length;i++)pool.push(i);}
  const idx=pool[Math.floor(RNG()*pool.length)];
  S.recentBet.push(idx);while(S.recentBet.length>Math.min(7,GEN_BET_TITLES.length-1))S.recentBet.shift();
  const p=GEN_BET_TITLES[idx];
  const base=Math.max(CUR.betBase||100000,Math.round(net(S)*0.05));
  return {kind:'bet',gen:true,chap:'投資時刻',t:p.t,x:p.x,base};
}

/* 選項只顯示「做什麼」,不劇透會加減什麼(保留驚喜);像「得:/失:」這種提示一律不顯示 */

/* 投資前的修煉:免費,每 3 年一次。這幾年的成長化成一次骰,骰運由心態/關係/名聲決定 */
function renderTrainStep(target){
  AWAIT=false;S.pendingScene=target;S.lastBetAge=S.age;S._rolledThisTrain=false;   // 這次投資後 3 年內不再自動出現
  const q=Math.round(stateQuality()*100);
  const stage=document.getElementById('stage');
  stage.innerHTML=`<div class="beat-head"><span class="chap">修煉時間 · 這幾年的累積</span><span class="yr">${S.year} 年 · ${S.age}歲</span><span class="tt">🎲 修煉一下</span></div>
    ${incomeBanner()}<div class="story">這幾年的歷練化成一次<b>修煉</b>。你的<b>心態・關係・名聲</b>越好,越容易骰出高點、收穫越大(目前狀態 <b style="color:var(--gold)">${q}%</b>);狀態低迷則會拖累手氣。所以你怎麼過日子、怎麼選,都會回到你的成長上。</div>
    <div class="spwarn" id="spWarn" style="display:none"></div>
    <div class="trainbox" id="trainBox">

/* ---------- 倍數下注事件 ---------- */
function betRisk(sc,t){const base=sc.base||CUR.betBase||100000;const avail=Math.max(0,S.cash)+Math.max(0,S.stock);return Math.max(0,Math.min(base*t.mult,Math.floor(avail)));}
function renderBet(sc){
  AWAIT=false;
  const story=(typeof sc.x==='function')?sc.x(S):sc.x;
  let html=sceneHead(sc)+incomeBanner()+`<div class="story">${story}</div>
    <div class="betwrap"><div class="bl">📊 選一個投入倍數 · 成功率越高越安全,倍數越大賺賠越多(升「眼光」技能可提高成功率)</div><div class="bets">`;
  BET_TIERS.forEach((t,i)=>{
    const risk=betRisk(sc,t);
    const winP=Math.round(betWinP(t)*100);
    const winAmt=Math.round(risk*t.winMult*(1+0.15*lvl('finiq')));
    html+=`<button class="betopt ${t.cls}" data-i="${i}">
      <div class="mx">×${t.mult}</div>
      <div class="bi"><div class="bt">${t.label}</div><div class="bs">${t.sub}　投入約 ${fmt(risk)}</div></div>
      <div class="odds">成功率<br><b style="font-size:17px">${winP}%</b><br><span style="color:var(--up)">賺 ${fmt(winAmt)}</span></div></button>`;
  });
  html+=`</div></div>`;
  const stage=document.getElementById('stage');stage.innerHTML=html;
  stage.querySelectorAll('.betopt').forEach(b=>{b.onclick=()=>resolveBet(sc,+b.dataset.i);});
  stage.style.animation='none';void stage.offsetWidth;stage.style.animation='fade .35s';
  renderLog();
}
function resolveBet(sc,i){
  if(AWAIT)return;
  AWAIT=true;
  const t=BET_TIERS[i],stake=betRisk(sc,t),winP=betWinP(t);
  const win=RNG()<winP;
  let profit=0,loss=0;
  if(win){profit=Math.round(stake*t.winMult*(1+0.15*lvl('finiq')));
    const fromCash=Math.min(Math.max(0,S.cash),stake);   // 買進:本金從現金轉進持股
    S.cash-=fromCash;S.stock=(S.stock||0)+fromCash+profit; // 賺到的部位抱著,之後每年跟著市場滾複利
    S.mind=clamp(S.mind+t.mgood);if(t.mult>=3)S.fame=clamp(S.fame+3);}
  else{loss=Math.round(stake*t.lossMult*Math.max(0.1,1-0.12*lvl('disc')));let rem=loss;const fc=Math.min(Math.max(0,S.cash),rem);S.cash-=fc;rem-=fc;if(rem>0){const fs=Math.min(Math.max(0,S.stock),rem);S.stock-=fs;rem-=fs;}if(rem>0)S.debt=(S.debt||0)+rem;S.mind=clamp(S.mind-t.mbad*Math.max(0.1,1-0.15*lvl('mindful')));}
  if(t.mult>=5)S.flags.aggressive=true;
  S.log.push({yr:S.year,txt:`投資 ×${t.mult}(成功率${Math.round(winP*100)}%)${win?' 獲利':' 虧損'}`});
  if(S.cash<=0&&S.stock<=0)S.bankrupt=true;
  renderHUD();
  const stage=document.getElementById('stage');stage.querySelector('.betwrap').style.display='none';
  const div=document.createElement('div');div.className='result '+(win?'good':'bad');
  div.innerHTML=`<div style="text-align:center;font-size:30px;margin-bottom:4px">${win?'📈':'📉'}</div>
    ${win?`<b>${t.label}(×${t.mult})</b>,成功率 ${Math.round(winP*100)}% —— <b style="color:var(--up)">投資成功!</b>獲利 <b>+${fmt(profit)}</b>,連同本金轉入<b>持股</b>,之後每年跟著市場滾複利。`:`<b>${t.label}(×${t.mult})</b>,成功率 ${Math.round(winP*100)}% —— <b style="color:var(--down)">這次沒看準</b>,虧損 <b>−${fmt(loss)}</b>。`}`;
  stage.appendChild(div);
  const nb=document.createElement('button');nb.className='nextbtn';
  if(S.bankrupt){nb.textContent='💀 破產結算 →';nb.onclick=()=>resolveEnding();}
  else{nb.textContent='繼續 →';nb.onclick=()=>{if(sc.gen)stepKeep();else continueTo(sc.go);};}
  stage.appendChild(nb);
}

/* ---------- 修煉骰技能點(免費,每 3 年一次;骰運由心態/關係/名聲決定) ---------- */
function openSheet(id){document.getElementById('sheetBg').classList.add('show');document.getElementById(id).classList.add('show');}
function closeSheets(){document.getElementById('sheetBg').classList.remove('show');document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('show'));}
const TRAIN_DICE=3; /* 修煉一次骰 3 顆 */
/* 狀態品質 0(差)~1(好):心態、關係、名聲的平均。越高→越容易骰到高點 */
function stateQuality(){return clamp(((S.mind||0)+(S.rel||0)+(S.fame||0))/3,0,100)/100;}
function rollDie(){
  const q=stateQuality();const w=[];let tot=0;
  for(let v=1;v<=6;v++){let x=1+(q-0.5)*(v-3.5)*0.9;if(x<0.05)x=0.05;w.push(x);tot+=x;}   // q 高→高點權重大
  let r=RNG()*tot,acc=0;for(let v=1;v<=6;v++){acc+=w[v-1];if(r<acc)return v;}return 6;
}
function rollForSP(){
  if(S._rolledThisTrain)return;S._rolledThisTrain=true;S.diceRolls=(S.diceRolls||0)+1;
  const vals=[];for(let k=0;k<TRAIN_DICE;k++)vals.push(rollDie());
  const sum=vals.reduce((a,b)=>a+b,0);const gain=Math.ceil(sum/2);S.sp+=gain;   // 點數減半:技能要慢慢養,點滿是奢望
  const q=stateQuality();const qtxt=q>=0.62?'狀態極佳,手氣加持':(q>=0.45?'狀態平穩':'狀態低迷,拖累了手氣');
  document.getElementById('diceRow').innerHTML=vals.map(v=>`<div class="dice sm num roll ${v>=5?'g':(v<=2?'b':'')}">${v}</div>`).join('');
  document.getElementById('diceRes').innerHTML=`骰出 <b>${vals.join(' + ')}</b> = <b>${sum}</b>(${qtxt})→ 化為 <b style="color:var(--gold)">${gain}</b> 技能點!`;
  const rb=document.getElementById('rollBtn');if(rb){rb.disabled=true;rb.textContent='✓ 這次修煉已完成';}
  renderHUD();renderSkillList();
}
/* ---------- 技能樹 ---------- */
function renderSkillList(){
  document.getElementById('skSP').textContent=S.sp||0;
  const box=document.getElementById('skillList');box.innerHTML='';
  if(!S.skillProg)S.skillProg={};
  SKILLS.forEach(sk=>{
    const cur=lvl(sk.id),cost=cur+1,maxed=cur>=sk.max;
    const prog=S.skillProg[sk.id]||0;
    const pips=Array.from({length:sk.max},(_,i)=>`<i class="${i<cur?'on':''}"></i>`).join('');
    const note=maxed?'<span style="color:var(--up);font-weight:700">已點滿 MAX</span>':`下一級 <b>${prog}/${cost}</b> 點${prog>=cost?'':`(再投 ${cost-prog} 點升級)`}`;
    const el=document.createElement('div');el.className='skl';
    el.innerHTML=`<div class="ic">${sk.ic}</div><div class="info"><div class="n">${sk.n} <span style="color:var(--ink3);font-size:11px">Lv.${cur}/${sk.max}</span></div><div class="d">${sk.d}</div><div class="lv">${pips}</div><div class="prog">${note}</div></div>`;
    const up=document.createElement('button');up.className='up'+(maxed?' max':'');
    if(maxed){up.textContent='MAX';up.disabled=true;}
    else{up.innerHTML='＋1';up.disabled=(S.sp<1);up.title='投入 1 技能點';
      up.onclick=()=>{if(S.sp<1)return;S.sp-=1;let p=(S.skillProg[sk.id]||0)+1;if(p>=cost){S.skills[sk.id]=cur+1;S.skillProg[sk.id]=0;}else{S.skillProg[sk.id]=p;}renderSkillList();renderHUD();};}
    el.appendChild(up);box.appendChild(el);
  });
  updateTrainGate();   // 骰完/點完技能後,更新「進入投資」是否可按
}

function moralOf(s,tier){

  if(tier.key==='頂級富豪'||tier.key==='富豪')return f.married&&s.rel>=58?'如今你考慮的不再是賺錢,而是如何把這份財富與人生的意義,好好傳下去。':'你贏得了金錢,卻在某個深夜發現,能一起分享的人並不多。財富與幸福,你只抓住了一半。';
  if(tier.min>=1000000)return'回頭看,你沒有走捷徑,而是靠一個個踏實的決定,把日子過成了自己想要的樣子。';
  if(tier.key==='平凡')return'沒有暴富,也沒有慘賠。平凡,或許正是股海裡最難、也最被低估的一種勝利。';

}
function composeEnding(s){
  const nn=net(s),tier=tierOf(nn),fam=famStatus(s);
  const para=[tier.w,houseStatus(s)+fam.t,[spiritStatus(s),fameStatus(s)].filter(Boolean).join(''),moralOf(s,tier)].filter(Boolean).join('\n');
  const title=tier.key+'的'+traitOf(s);
  return{emoji:(CUR.endEmoji&&CUR.endEmoji[tier.key])||tier.emoji,title,tier,fam,para};
}
function rankOf(nn,s){
  const wb=(s.mind+s.rel)/2;
  /* 負資產先攔下來:星等一律見底,不會因為心態好就加星
     (欠債近千萬談不上「清貧但知足」,更不可能是「家和萬事興」) */
  if(nn<0){
    if(nn>-1000000)return '★☆☆☆☆  傷筋動骨';
    if(nn>-5000000)return wb>=62?'☆☆☆☆☆  賠掉了錢,還好沒賠掉人':'☆☆☆☆☆  元氣大傷';
    return wb>=62?'☆☆☆☆☆  一無所有,只剩身邊的人':'☆☆☆☆☆  一敗塗地';
  }
  if(nn>=200000000)return '★★★★★  頂級富豪';
  if(nn>=50000000&&wb>=55)return '★★★★★  人生勝利組';
  if(nn>=50000000)return '★★★★☆  富有但空洞';
  if(nn>=10000000&&wb>=55)return '★★★★☆  安穩上岸';
  if(nn>=10000000)return '★★★★☆  有錢沒閒';
  if(nn>=1000000&&wb>=58)return '★★★☆☆  小康幸福';
  if(nn>=1000000)return '★★★☆☆  略有積蓄';
  if(wb>=72)return '★★★☆☆  家和萬事興';
  if(wb>=60)return '★★★☆☆  平凡是福';
  return '★★☆☆☆  勉強打平';
}

/* ---------- 結局圖(canvas) ---------- */
function wrapText(ctx,text,maxW){const NOSTART='。,、;:!?)）】」』.…%─—～';const lines=[];let line='';for(const ch of text){if(ch==='\n'){lines.push(line);line='';continue;}const t=line+ch;if(ctx.measureText(t).width>maxW&&line&&NOSTART.indexOf(ch)<0){lines.push(line);line=ch;}else line=t;}if(line)lines.push(line);return lines;}
function roundRect(x,rx,ry,w,h,r){x.beginPath();x.moveTo(rx+r,ry);x.arcTo(rx+w,ry,rx+w,ry+h,r);x.arcTo(rx+w,ry+h,rx,ry+h,r);x.arcTo(rx,ry+h,rx,ry,r);x.arcTo(rx,ry,rx+w,ry,r);x.closePath();}
function drawSkillsRow(x,skills,cx,y,TC){
  const nameF='700 33px '+TC,numF='800 33px '+TC,gap=28;
  let total=0;const segs=skills.map(s=>{x.font=nameF;const nw=x.measureText(s.n+' ').width;x.font=numF;const vw=x.measureText(String(s.lv)).width;total+=nw+vw;return{s,nw,vw};});
  total+=gap*(skills.length-1);
  let px=cx-total/2;const prev=x.textAlign;x.textAlign='left';
  segs.forEach(seg=>{
    x.fillStyle='#ffe0da';x.font=nameF;x.fillText(seg.s.n+' ',px,y);px+=seg.nw;
    x.fillStyle=(seg.s.lv>0?'#F6C453':'#9a7d7d');x.font=numF;x.fillText(String(seg.s.lv),px,y);px+=seg.vw+gap;
  });
  x.textAlign=prev;
}
function drawResultImage(){

  const EMO='"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif';
  const stripLead=s=>s.replace(/^[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}⭐❤️︎‍\s]+/u,'');
  const meas=document.createElement('canvas').getContext('2d');
  /* 三行總結:以「完整句子」為單位,湊滿最多 3 行就收 */
  meas.font='400 33px '+TC;
  const flat=E.para.split('\n').map(s=>stripLead(s.trim())).filter(Boolean).join(' ');
  const sents=flat.split(/(?<=[。!?!?])/).map(s=>s.trim()).filter(Boolean);
  let picked='';
  for(const s of sents){const t=picked?picked+' '+s:s;if(wrapText(meas,t,W-300).length>3)break;picked=t;}
  if(!picked)picked=sents[0]||flat;   // 第一句就超過 3 行的極端情況,硬切
  let sum=wrapText(meas,picked,W-300);
  if(sum.length>3){sum=sum.slice(0,3);sum[2]=sum[2].replace(/[,。;、:]+$/,'')+'……';}
  /* 結論標題 */
  const titleFont=(E.title.length<=5?100:E.title.length<=7?86:E.title.length<=9?72:60);
  meas.font='900 '+titleFont+'px '+TC;
  const titleLines=wrapText(meas,E.title,W-170);
  const titleLH=Math.round(titleFont*1.14);

  const skTxt='操盤戰力 '+d.ovr+'    '+skills.map(s=>`${s.n} ${s.lv}`).join('  ');
  /* ---- 版面(由上往下) ---- */
  let y=210;
  const nameY=y; y+=52;
  const roleY=y; y+=96;
  const emojiY=y+96; y+=140;
  const titleY0=y+titleFont; y+=titleLines.length*titleLH+18;
  const rankY=y+30; y+=92;
  const lblY=y+22; y+=62;
  const amtY=y+96; y+=152;
  const phaseY=y+30; y+=78;          // 階段徽章:讓玩家知道自己到底算哪一級
  const skY=y+20; y+=84;
  const hrY=y; y+=64;
  const sumY0=y+30; y+=sum.length*54+64;
  const footY=y+26;
  const H=Math.round(footY+118);
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
  /* 背景:跟遊戲版面一致的亮粉暖色,頂部一抹淡紅光暈 */
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#fdeeee');g.addColorStop(.5,'#fbe7e5');g.addColorStop(1,'#f7dcda');x.fillStyle=g;x.fillRect(0,0,W,H);
  const rg=x.createRadialGradient(cx,-160,0,cx,-160,900);rg.addColorStop(0,'rgba(227,6,19,.07)');rg.addColorStop(1,'rgba(227,6,19,0)');x.fillStyle=rg;x.fillRect(0,0,W,H);
  /* 白卡+細金邊框 */
  x.fillStyle='rgba(255,255,255,.72)';roundRect(x,52,52,W-104,H-104,26);x.fill();
  x.strokeStyle='rgba(184,134,11,.4)';x.lineWidth=2;roundRect(x,52,52,W-104,H-104,26);x.stroke();
  x.strokeStyle='rgba(184,134,11,.14)';x.lineWidth=1;roundRect(x,64,64,W-128,H-128,20);x.stroke();
  x.textAlign='center';x.textBaseline='alphabetic';
  /* 新光證券官方 LOGO:右上角(直接取用天空標裡內嵌的原圖) */
  (function(){
    const li=document.querySelector('#skybug .sb-logo');
    if(li&&li.complete&&li.naturalWidth){
      const lw=250,lh=Math.round(lw*li.naturalHeight/li.naturalWidth),lx=W-84-lw,ly=84;

      x.fillStyle='#E60012';const lw=196,lh=56,lx=W-88-lw,ly=88;roundRect(x,lx,ly,lw,lh,12);x.fill();

  x.textAlign='left';x.fillStyle='rgba(227,6,19,.65)';x.font='800 24px '+TC;x.save();if('letterSpacing' in x)x.letterSpacing='6px';x.fillText('股神養成計畫',92,124);x.restore();x.textAlign='center';
  /* 名字 + 年齡身分 */
  x.fillStyle='#2b0d10';x.font='800 46px '+TC;x.fillText(PNAME||CUR.name,cx,nameY);
  x.fillStyle='rgba(214,61,76,.75)';x.font='500 27px '+TC;x.save();if('letterSpacing' in x)x.letterSpacing='3px';x.fillText(`${d.age} 歲 · ${roleOf(CUR)}`,cx,roleY);x.restore();

  x.font='104px '+EMO;x.fillText(E.emoji,cx,emojiY);
  x.fillStyle='#2b0d10';x.font='900 '+titleFont+'px '+TC;let tly=titleY0;titleLines.forEach(l=>{x.fillText(l,cx,tly);tly+=titleLH;});
  x.fillStyle='#b8860b';x.font='600 34px '+TC;x.save();if('letterSpacing' in x)x.letterSpacing='4px';x.fillText(d.rankTxt.replace(/\s+/g,' '),cx,rankY);x.restore();
  /* 資產:主角級大數字 */
  x.fillStyle='rgba(160,110,60,.65)';x.font='600 26px '+TC;x.save();if('letterSpacing' in x)x.letterSpacing='8px';x.fillText('最 終 資 本 額',cx,lblY);x.restore();
  const amtGrad=x.createLinearGradient(0,amtY-100,0,amtY);

  x.fillStyle=amtGrad;x.font='900 124px '+TC;x.fillText(fmt(d.nn),cx,amtY);
  /* 階段徽章:標出「六階中的第幾階」,給玩家一個可炫耀的相對定位 */
  (function(){
    let pi=0;for(let k=0;k<PHASE_AMT.length;k++){if(d.nn>=PHASE_AMT[k])pi=k;}
    const nm=PHASES[pi],sub='第 '+(pi+1)+' 階 / 共 '+PHASES.length+' 階';
    x.font='800 30px '+TC;const nw=x.measureText(nm).width;
    x.font='600 24px '+TC;const sw=x.measureText(sub).width;
    const pw=nw+sw+74,ph=52,px0=cx-pw/2,py0=phaseY-36;
    x.fillStyle=pi>=4?'rgba(246,196,83,.22)':'rgba(184,134,11,.10)';
    x.strokeStyle=pi>=4?'rgba(184,134,11,.75)':'rgba(184,134,11,.38)';x.lineWidth=2;
    roundRect(x,px0,py0,pw,ph,26);x.fill();x.stroke();
    const prev=x.textAlign;x.textAlign='left';
    x.fillStyle='#8a5a00';x.font='800 30px '+TC;x.fillText(nm,px0+26,phaseY);
    x.fillStyle='rgba(140,95,60,.78)';x.font='600 24px '+TC;x.fillText(sub,px0+26+nw+22,phaseY-1);

  })();
  /* 戰力 + 技能,一行棕金小字 */
  x.fillStyle='rgba(140,95,60,.8)';x.font='500 27px '+TC;x.fillText(skTxt,cx,skY);
  /* 金色細分隔線 */
  const hw=120;x.strokeStyle='rgba(184,134,11,.5)';x.lineWidth=2;x.beginPath();x.moveTo(cx-hw,hrY);x.lineTo(cx+hw,hrY);x.stroke();
  /* 三行總結 */
  x.fillStyle='rgba(70,35,38,.88)';x.font='400 33px '+TC;let sy=sumY0;sum.forEach(l=>{x.fillText(l,cx,sy);sy+=54;});
  /* 頁尾:網址(讓看到圖的人知道去哪玩)+ 計畫名與種子 */
  x.fillStyle='rgba(227,6,19,.8)';x.font='800 27px '+TC;x.fillText('👉 '+GAME_URL,cx,footY+4);
  x.fillStyle='rgba(150,105,110,.6)';x.font='500 21px '+TC;x.save();if('letterSpacing' in x)x.letterSpacing='2px';x.fillText('股神養成計畫 · 命運種子 '+SEED,cx,footY+42);x.restore();
  return cv;
}
